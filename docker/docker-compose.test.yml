version: '3.8'

networks:
  # 1. 模拟内网私网环境（靶机网络）
  lan_mock_net:
    driver: bridge
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.254
        - subnet: fd00:1111::/64
          gateway: fd00:1111::fe

  # 2. 模拟公网互联网（靶机网络，直接定义公网网段）
  wan_mock_net:
    driver: bridge
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 1.1.1.0/24
          gateway: 1.1.1.254
        - subnet: 2606:4700:4700::/64
          gateway: 2606:4700:4700::fe

services:
  # 被测网关（已用 nix-build 加载好的本地镜像，Sidecar 架构，仅需 NET_ADMIN）
  gateway:
    image: nix-nft-gateway:latest
    container_name: test_gateway
    cap_add:
      - NET_ADMIN          # 配置 nftables 规则及网络伪装必需
    environment:
      - DNS_UPSTREAM_V4=1.1.1.1
      - DNS_UPSTREAM_V6=2606:4700:4700::1111
    volumes:
      - ../test_whitelist.txt:/etc/nftables/whitelist.txt
    networks:
      lan_mock_net:
        ipv4_address: 192.168.100.2
        ipv6_address: fd00:1111::2
      wan_mock_net:
        ipv4_address: 1.1.1.2
        ipv6_address: 2606:4700:4700::2
    restart: unless-stopped

  # 靶机 A：模拟公网服务器与公网安全 DNS
  mock-wan:
    image: alpine:latest
    container_name: mock_wan
    networks:
      wan_mock_net:
        ipv4_address: 1.1.1.1
        ipv6_address: 2606:4700:4700::1111
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << "EOF" > /tmp/resp.sh
        #!/bin/sh
        echo -ne "HTTP/1.1 200 OK\r\nConnection: close\r\nContent-Length: 11\r\n\r\nInternet-OK"
        EOF
        chmod +x /tmp/resp.sh
        cat << "EOF" > /tmp/dns_resp.sh
        #!/bin/sh
        echo "SAFE-DNS-OK"
        EOF
        chmod +x /tmp/dns_resp.sh
        cat << "EOF" > /tmp/udp_loop.sh
        #!/bin/sh
        while true; do
          nc -u -l -p 53 -e /tmp/dns_resp.sh 2>/dev/null
        done
        EOF
        chmod +x /tmp/udp_loop.sh
        nc -lk -p 80 -e /tmp/resp.sh &
        nc -lk -p 53 -e /tmp/dns_resp.sh &
        /tmp/udp_loop.sh &
        wait

  # 靶机 B：模拟局域网内部服务器 (内网 HTTP 与内部 DNS 服务)
  mock-lan:
    image: alpine:latest
    container_name: mock_lan
    networks:
      lan_mock_net:
        ipv4_address: 192.168.100.10
        ipv6_address: fd00:1111::10
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << "EOF" > /tmp/resp.sh
        #!/bin/sh
        echo -ne "HTTP/1.1 200 OK\r\nConnection: close\r\nContent-Length: 6\r\n\r\nLAN-OK"
        EOF
        chmod +x /tmp/resp.sh
        cat << "EOF" > /tmp/dns_leak.sh
        #!/bin/sh
        echo "LAN-DNS-LEAK"
        EOF
        chmod +x /tmp/dns_leak.sh
        cat << "EOF" > /tmp/udp_leak_loop.sh
        #!/bin/sh
        while true; do
          nc -u -l -p 53 -e /tmp/dns_leak.sh 2>/dev/null
        done
        EOF
        chmod +x /tmp/udp_leak_loop.sh
        nc -lk -p 80 -e /tmp/resp.sh &
        nc -lk -p 53 -e /tmp/dns_leak.sh &
        /tmp/udp_leak_loop.sh &
        wait

  # 测试发包机：模拟实际无特权业务容器（零特权，Sidecar 共享网关网络）
  tester:
    image: alpine:latest
    container_name: tester
    network_mode: "service:gateway"
    depends_on:
      - gateway
      - mock-wan
      - mock-lan
    command: ["sleep", "infinity"]
