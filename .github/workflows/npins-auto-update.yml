name: Auto Update npins

on:
  schedule:
    # 每日北京时间 01:00 (UTC 17:00)
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  update-npins:
    name: Update npins dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update npins
        run: |
          nix-shell -p npins --run "npins update"
          # 遵循 AGENTS.md 规范：不要提交 default.nix 修改，该文件由工具自动生成
          git checkout -- npins/default.nix 2>/dev/null || true

      - name: Check for changes
        id: git-check
        run: |
          if git status --porcelain npins/sources.json | grep -q "npins/sources.json"; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "npins is already up-to-date."
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update npins dependencies"
          title: "chore(deps): update npins dependencies"
          body: |
            Automated dependency update generated by npins.

            - Updated `npins/sources.json`
            - Automatically requested auto-merge once CI checks pass.
          branch: npins-update
          delete-branch: true
          base: main

      - name: Enable Auto-Merge
        if: steps.git-check.outputs.has_changes == 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Enabling auto-merge for PR #${PR_NUM}..."
          gh pr merge "$PR_NUM" --auto --squash || gh pr merge "$PR_NUM" --auto --merge || gh pr merge "$PR_NUM" --auto --rebase || echo "Auto-merge might already be active or requires manual repository configuration."
