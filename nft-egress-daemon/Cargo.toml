[package]
name = "nft-egress-daemon"
version = "0.1.0"
edition = "2024"
description = "High performance, atomic nftables egress whitelist gateway daemon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/nix-nft-egress"
readme = "README.md"
keywords = ["nftables", "firewall", "egress", "gateway", "whitelist"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
inotify = { version = "0.11", default-features = false }
libc = "0.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
